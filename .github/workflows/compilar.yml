name: Crear APK Android
on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar archivos del repositorio
        uses: actions/checkout@v4

      - name: Reconstruir proyecto desde PY o JSON
        run: |
          python3 -c '
          import os, json, glob
          py_files = glob.glob("*.py")
          json_files = glob.glob("*.json")
          if py_files:
              exec(open(py_files[0], encoding="utf-8").read())
          elif json_files:
              data = json.load(open(json_files[0], encoding="utf-8"))
              for path, content in data.items():
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  open(path, "w", encoding="utf-8").write(content)
          else:
              raise SystemExit("No se encontró archivo .py ni .json")
          '

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Construir el archivo APK
        run: |
          cd SynthesiscoAndroidApp
          gradle assembleDebug --no-daemon

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-APK
          path: SynthesiscoAndroidApp/app/build/outputs/apk/debug/app-debug.apk
